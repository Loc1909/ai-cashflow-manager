services:
  db:
    image: postgres:16-alpine
    container_name: cashflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow_password
      POSTGRES_DB: cashflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cashflow-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cashflow:cashflow_password@db:5432/cashflow_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  adminer:
    image: adminer
    container_name: cashflow-adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    depends_on:
      - db

volumes:
  postgres_data:
